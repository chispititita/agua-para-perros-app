<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2c1f"/>
      <stop offset="100%" stop-color="#2c1d14"/>
    </linearGradient>
    <pattern id="p" width="70" height="70" patternUnits="userSpaceOnUse">
      <circle cx="35" cy="35" r="1.3" fill="#c98a2c" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#p)"/>

  <!-- Distintivo discreto de imagen de muestra (no interfiere con el título) -->
  <g transform="translate(60,988)">
    <rect width="430" height="46" rx="23" fill="#000000" opacity="0.35"/>
    <text x="215" y="30" font-family="Arial, sans-serif" font-size="17" fill="#faf3e6" text-anchor="middle" opacity="0.9">FOTO DE MUESTRA — SUSTITUIR POR FOTO REAL</text>
  </g>
