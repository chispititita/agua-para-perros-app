name: Ajedrez · pruebas del servidor

on:
  push:
    paths:
      - "ajedrez/servidor/**"
      - ".github/workflows/ajedrez-servidor.yml"
  pull_request:
    paths:
      - "ajedrez/servidor/**"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ajedrez/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ajedrez/servidor/package-lock.json
      - run: npm ci
      - run: npm test
