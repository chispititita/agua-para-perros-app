# Compila la app de Android de Jaque Arena en la nube.
# Resultado (pestaña Actions → la ejecución → "Artifacts"):
#   - jaque-arena-apk: APK para instalar y probar en tu móvil
#   - jaque-arena-aab: archivo .aab firmado para subir a Google Play (solo si has configurado la llave)
name: Ajedrez · compilar Android

on:
  workflow_dispatch:   # se lanza a mano: Actions → "Ajedrez · compilar Android" → Run workflow

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ajedrez/app
    env:
      VITE_SERVIDOR: ${{ vars.SERVIDOR_AJEDREZ }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la dirección del servidor
        run: |
          if [ -z "$VITE_SERVIDOR" ]; then
            echo "::error::Falta la variable SERVIDOR_AJEDREZ (Settings → Secrets and variables → Actions → Variables). Mira ajedrez/README.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ajedrez/app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar y compilar la web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Preparar la llave de firma
        id: llave
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "firmar=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay llave configurada: solo se genera el APK de prueba. Mira ajedrez/README.md"
          fi

      - name: Compilar APK y AAB
        working-directory: ajedrez/app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          if [ "${{ steps.llave.outputs.firmar }}" = "si" ]; then ./gradlew bundleRelease; fi

      - uses: actions/upload-artifact@v4
        with:
          name: jaque-arena-apk
          path: ajedrez/app/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.llave.outputs.firmar == 'si'
        with:
          name: jaque-arena-aab
          path: ajedrez/app/android/app/build/outputs/bundle/release/*.aab
