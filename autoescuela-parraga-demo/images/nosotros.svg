<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e4e7ec"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg2)"/>
  <circle cx="760" cy="120" r="60" fill="#2563eb" opacity="0.1"/>
  <circle cx="110" cy="600" r="90" fill="#0a2540" opacity="0.06"/>

  <!-- volante -->
  <g transform="translate(450,330)">
    <circle r="150" fill="none" stroke="#0a2540" stroke-width="26"/>
    <circle r="34" fill="#0a2540"/>
    <rect x="-10" y="-150" width="20" height="60" rx="8" fill="#0a2540"/>
    <rect x="-140" y="55" width="20" height="60" rx="8" fill="#0a2540" transform="rotate(-35)"/>
    <rect x="120" y="55" width="20" height="60" rx="8" fill="#0a2540" transform="rotate(35)"/>
  </g>

  <!-- libro / material teórico -->
  <g transform="translate(160,420)">
    <rect width="180" height="130" rx="10" fill="#2563eb"/>
    <rect x="14" y="16" width="152" height="14" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="14" y="42" width="120" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="14" y="62" width="140" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="14" y="82" width="100" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- check de progreso -->
  <g transform="translate(600,470)">
    <circle r="46" fill="#25d366"/>
    <path d="M-18 0 L-4 16 L20 -18" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(28,640)">
    <rect width="300" height="34" rx="17" fill="#0a2540" opacity="0.5"/>
    <text x="150" y="23" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Ilustración genérica de autoescuela</text>
  </g>
</svg>
